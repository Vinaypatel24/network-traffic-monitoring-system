spring.application.name=network-monitor-backend

# Server Port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:network_monitor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations for H2
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT Security Configuration
# 256-bit secret key (min 32 chars for HS256)
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
jwt.expiry-ms=${JWT_EXPIRY_MS:900000}
jwt.refresh-expiry-days=${REFRESH_TOKEN_EXPIRY_DAYS:7}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Threat Detection Configuration
threat.port-scan.threshold=50
threat.port-scan.window-seconds=10
threat.traffic-spike.threshold-multiplier=3.0
threat.traffic-spike.min-packets=100
threat.abnormal-rate.threshold-packets-per-sec=1000

# Pipeline and Broadcasting Configuration
capture.queue-capacity=50000
capture.worker-threads=4
capture.batch-flush-size=2000
capture.batch-flush-interval-ms=500
capture.broadcast-interval-ms=1000
capture.broadcast-max-packets=200

# Statistics Aggregation
statistics.flush-interval-ms=5000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
